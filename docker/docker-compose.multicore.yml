# Override for the stock NocoBase compose file: run the app under the multicore supervisor.
#   docker compose -f docker-compose.yml -f docker/docker-compose.multicore.yml up -d app
# Requires a redis service and in the base file's `app` service:  REDIS_URL=redis://redis:6379/0
# The supervisor lives in the persistent storage volume (put there by scripts/install.sh):
services:
  app:
    entrypoint: ["/bin/sh", "/app/nocobase/storage/multicore/supervisor/docker/entrypoint.sh"]
